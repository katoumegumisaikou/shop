services:
  postgres:
    image: postgres:16
    container_name: shop-postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - shop-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shop-redis
    ports:
      - "6379:6379"
    volumes:
      - shop-redis-data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  shop-pg-data:
  shop-redis-data:
